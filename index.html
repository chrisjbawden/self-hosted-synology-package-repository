<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Synology Package Repository</title>
</head>
<body>
<script>
    fetch('./packages.json')
        .then(response => {
            if (!response.ok) {
                throw new Error('Failed to load packages.json');
            }
            return response.json();
        })
        .then(data => {
            document.open();
            document.write(
                '<pre>' + JSON.stringify(data, null, 2) + '</pre>'
            );
            document.close();
        })
        .catch(error => {
            document.body.textContent = error.message;
        });
</script>
</body>
</html>
